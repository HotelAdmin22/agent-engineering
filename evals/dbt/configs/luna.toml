# Luna as the main role. NOT the control.
#
# Main runs on gpt-6-luna instead of gpt-6.1-sol: 0.10/0.50 per Mtok against
# 2/10, so roughly 20x cheaper per task. That is the point -- iterate on the
# harness and the prompt without spending the control run's budget.
#
# It is deliberately NOT comparable to baseline.toml. report --compare refuses
# runs whose main model differs, which is correct: a Luna-main result says
# nothing about a Sol-main one. When you want the reportable control, run
# baseline.toml unchanged.
#
# routed.toml's subagents are already Luna, so with Luna as main that config
# loses its small-model/frontier-model distinction entirely. Do not read a
# Luna-main routed run as evidence about delegation.

# Spider2-DBT control: the main role only, one loop, no subagents.
# routed.toml must match this file everywhere except `experiment`,
# roles.main.tools, [roles.explore], [roles.diagnose] and [delegation];
# `report --compare` refuses runs whose configs differ anywhere else.

experiment = "luna"
attempts = 3                        # D3
task_manifest = "evals/dbt/manifests/tasks_64.json"
splits = "evals/dbt/manifests/splits.json"
spider2_root = "vendor/Spider2/spider2-dbt"   # V9: sparse clone, gitignored
runs_dir = "runs/dbt"               # V9: runs/ is gitignored
concurrency = 2                     # see note below
# D10 plans concurrency 4 for full runs. Not here -- but the original reason
# given was wrong, so here is the measured one.
#
# The old note reasoned from the 4g *limit* and concluded 4 workers could claim
# all of RAM. A limit is a cap, not a reservation. Sampled during
# luna-20261010-163234: peak 240 MB per container, 5.85% of the cap, two
# containers together under 300 MB. 192 attempts have recorded 0 OOMs. Memory
# is not what bounds concurrency here; API rate and wall-clock cost are.
#
# It stays at 2 for one reason only: **any run pooled with another must use the
# same value**, and the k=3 runs it is being compared against used 2. Change it
# only when starting a fresh comparison set.
task_timeout_s = 900                # D2; covers every role in the task

[sandbox]
image = "auto"                      # spider2-dbt-sandbox:<content hash>; never a tag here
network = "none"
memory = "4g"                       # D7
cpus = "2"                          # D7
pids_limit = 256                    # D7
user = "1000:1000"
keep_failed_containers = false      # debugging only; never for reportable runs

[api]
timeout_s = 120
max_retries = 2
include_reasoning = true            # V6: store=False needs encrypted reasoning carried forward

[roles.main]
model = "gpt-6-luna"
system_prompt = "evals/dbt/prompts/main.md"
tools = ["read_file", "list_files", "search_files", "write_file", "edit_file",
         "query_duckdb", "run_dbt"]  # D1
max_turns = 40                      # D2
# Five runs changed what the agent KNOWS -- catalog access, the .yml spec twice,
# its own declared assertions -- and pass@1 did not leave 0.219-0.266 once. The
# catalog fix removed 168 refused reads and moved accuracy by nothing. That is a
# consistent message: the gap is authoring the SQL, not finding the schema.
#
# This is the first change aimed at the authoring itself, and the whole reason
# it is worth trying before anything else is the price. Reasoning is billed as
# output: 1,700 tokens per attempt at $0.50/Mtok. Even eight times the thinking
# adds ~$1.14 to a 192-attempt run.
# RE-ENABLED 2026-10-13 for a k=6 test. exp6 reverted this on a k=3 null, and
# that decision was made under a 4.5x-inflated cost model: the "+57% cost" cited
# against it was $9.02 vs $5.76 in the old arithmetic and $2.01 vs $1.31 in
# reality -- seventy cents.
#
# The k=3 result hid something. Its three attempts were 0.297, 0.281 and 0.188.
# The first two are two of the four best attempts recorded in this project
# across 26; the third is the worst. That is exactly the shape k=3 cannot
# resolve, and this repo's own guidance says detecting a 2-task change needs
# k=6. The guidance was written and then not applied, because k=6 was believed
# to cost $12. It costs about $2.60.
reasoning_effort = "high"

[limits]
tool_output_max_chars = 4000

[runs]
# Each attempt's workspace and submitted database are deleted once it is
# scored: ~28 MB x 192 attempts filled a 466 GB disk and killed a run at
# attempt 3 of 3. Submissions are kept for this one attempt, because diffing a
# prediction against gold is the only way to learn what a failure was and it
# cannot be done later. 0 keeps none.
keep_submissions_for_attempt = 1

[prompt]
# OFF: measured harmful. Splicing the project's models/**/*.yml spec into the
# instruction cost no turns to deliver -- the block is ~800 tokens -- but on
# 128 scored attempts it raised mean turns 19.3 -> 23.6, attempts hitting the
# 40-turn cap 2 -> 19, mean input tokens 274k -> 422k, and cost $3.78 -> $5.72,
# for 28 passes against 31. Naming 11 models and saying each must exist sent
# the agent off building models the task never asked for.
#
# The code stays, tested and flag-controlled, because the finding is about this
# wording rather than about the mechanism. Anything that turns it back on needs
# a shorter block that does not imply the whole list is in scope.
inject_model_spec = false

[gateway]
max_rows_returned = 20
query_timeout_s = 30

[dbt]
allowed_commands = ["run", "build", "test", "compile", "parse"]
tool_timeout_s = 300
final_run = true
final_run_timeout_s = 600

# After the agent stops, run the project's own declared assertions and give it
# one pass to fix failures. 80% of these projects declare column tests (809
# not_null, 280 unique) and the agent ran `test` in 23% of attempts -- so the
# check already exists in the repo and is simply not consulted. not_null and
# unique target the two measured failure modes directly: columns that came out
# NULL, and models built at the wrong grain.
#
# A failing assertion is evidence, not a verdict: gold sometimes deviates from
# its own schema, so this never fails the attempt by itself. The evaluator
# remains the only thing that decides.
# OFF: measured null. The gate fires correctly and names the right rows --
# provider001's assertions flagged the same 2,857 rows a gold diff found -- but
# it does not convert. Over 157 gated attempts, those whose assertions passed
# clean scored 0.259 and those that failed and were repaired scored 0.222. One
# task passed, was repaired, and then failed. Knowing which rows are wrong is
# not the same as being able to fix them.
#
# Code and tests kept: the finding is about the repair pass, not about running
# the assertions, and the logs it writes are useful on their own.
test_gate = false

[pricing]                           # D5, USD per 1M tokens, listed 2026-10-07
"gpt-6-luna"  = { input = 0.10, output = 0.50, cached_input = 0.01 }
"gpt-6.1-sol" = { input = 2.00, output = 10.00, cached_input = 0.20 }
