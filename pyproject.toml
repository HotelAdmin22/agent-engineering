[project]
name = "agent-engineering"
version = "0.1.0"
description = "A learning repository for agent engineering, built one phase at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "openai>=1.0.0",
    "python-dotenv",
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dbt-sandbox = [
    "dbt-core>=1.9,<1.10",
    "dbt-duckdb>=1.9,<1.10",
    "gdown>=6.4.1",
    "google-cloud-bigquery>=3.46.1",
    "pandas>=3.0.6",
    "tqdm>=4.70.1",
]
dev = [
    "pytest",
    "anyio",
    # Spider's own evaluate.py compares result tables with pandas. A scoring
    # dependency, not an agent one -- the container does not score.
    "pandas",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
# vendor/ holds the Spider2 clone, whose dbt packages ship their own pytest
# suites. Without this a bare `pytest` walks into them and fails to collect.
testpaths = ["tests"]
norecursedirs = [".*", "vendor", "runs", "data", "transcripts", "node_modules"]
markers = [
    "docker: needs Docker and the spider2-dbt-sandbox image; run with -m docker",
]
