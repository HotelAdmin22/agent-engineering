[project]
name = "agent-engineering"
version = "0.1.0"
description = "A learning repository for agent engineering, built one phase at a time."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6.0",
    "openai>=1.0.0",
    "claude-agent-sdk",
    "python-dotenv",
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
agent = "agent_engineering.agent:main"

[dependency-groups]
dev = [
    "pytest",
    "anyio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_engineering", "src/agent"]
